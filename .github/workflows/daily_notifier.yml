name: Notificador Diário Telegram (Contas Fixas JLE)

on:
  workflow_dispatch: # Disparado pelo cron-job.org pontualmente às 08:00 BRT (segunda a sexta)

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependências
        run: |
          pip install Pillow

      - name: Enviar Notificação Diária Telegram
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://dmwefcngefeonxuukwdl.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || 'sb_publishable_j3AShmEr6aEWjqBv2rruhw_5EE4NnOt' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8776974965:AAGGvVaHwUqINKrIxcGg0jTa6UN7vy-KekU' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '-5576645321' }}
          WEB_APP_URL: 'https://contasfixasjle.vercel.app'
        run: |
          python telegram_cloud_notifier.py
