name: Notificador Diário Telegram (Contas Fixas JLE)

on:
  schedule:
    # Executa exclusivamente 1 vez ao dia às 11:00 UTC (08:00 no horário de Brasília)
    - cron: '0 11 * * *'
  workflow_dispatch: # Permite disparar manualmente pelo botão no GitHub com 1 clique

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar Dependências
        run: |
          pip install Pillow

      - name: Enviar Notificação Diária Telegram
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://vvbekmpzfznrfbhmxwah.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ2YmVrbXB6ZnpucmZiaG14d2FoIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4NjA0NTExMSwiZXhwIjoyMTAxNjIxMTExfQ.KUICQoXFJWOaqLqgV7kx6FesCT0OudpUmO-FB7Yrsbo' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8776974965:AAGGvVaHwUqINKrIxcGg0jTa6UN7vy-KekU' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '-5576645321' }}
          WEB_APP_URL: 'https://contasfixasjle.vercel.app'
        run: |
          python telegram_cloud_notifier.py
